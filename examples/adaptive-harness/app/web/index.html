<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stately adaptive harness</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        background: #10131a;
        color: #f4f6fb;
      }
      main {
        width: min(760px, 100%);
        min-height: 100vh;
        margin: auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header,
      footer {
        padding: 1rem;
        border-bottom: 1px solid #303746;
      }
      footer {
        border-top: 1px solid #303746;
        border-bottom: 0;
      }
      #messages {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        overflow: auto;
      }
      .message,
      .review {
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        white-space: pre-wrap;
      }
      .user {
        align-self: end;
        background: #315bb5;
        max-width: 85%;
      }
      .assistant {
        align-self: start;
        background: #242b38;
        max-width: 85%;
      }
      .review {
        background: #4a3014;
        border: 1px solid #bd7d2e;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input,
      button {
        font: inherit;
        border-radius: 0.5rem;
        border: 1px solid #58657c;
        padding: 0.7rem;
      }
      input {
        flex: 1;
        min-width: 0;
        background: #1b202b;
        color: inherit;
      }
      button {
        background: #315bb5;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      small { color: #aeb8ca; }
      #config-toggle { margin-top: .75rem; padding: .45rem .75rem; background: #283349; }
      #config-panel { padding: .8rem 1rem; background: #19212d; border-bottom: 1px solid #303746; max-height: 48vh; overflow: auto; }
      #config-panel[hidden] { display: none; }
      #config-panel pre { white-space: pre-wrap; font: .78rem/1.45 ui-monospace, monospace; overflow-wrap: anywhere; }
      #config-panel details { margin: .65rem 0; }
      #config-skills { display: grid; gap: .6rem; }
      .skill-row { display: flex; gap: .75rem; align-items: center; justify-content: space-between; background: #242b38; border-radius: .65rem; padding: .6rem; }
      .skill-row button { flex-shrink: 0; font-size: .85rem; padding: .45rem; }
      #config-summary { color: #aeb8ca; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <strong>Stately adaptive harness</strong><br /><small id="status"
          >Starting local session…</small
        ><div><button id="config-toggle" type="button" aria-expanded="false">Agent config &amp; skills</button></div>
      <section id="config-panel" hidden aria-label="Active runtime configuration">
        <div id="config-summary">Loading runtime configuration…</div>
        <details><summary>Identity (AGENTS.md)</summary><pre id="config-identity"></pre></details>
        <details><summary>Policy</summary><pre id="config-policy"></pre></details>
        <details><summary>Behavior</summary><pre id="config-behavior"></pre></details>
        <strong>Available prompt skills</strong><div id="config-skills"></div>
        <small>Prompt skills guide replies only. No shell, file-edit, remote tools or GitHub case-filing capability is attached.</small>
      </section>
      </header>
      <section id="messages" aria-live="polite"></section>
      <footer>
        <form id="chat">
          <input
            id="input"
            autocomplete="off"
            placeholder="Message the local harness…"
            required
          /><button>Send</button>
        </form>
      </footer>
    </main>
    <script>
      const messages = document.querySelector("#messages");
      const status = document.querySelector("#status");
      const input = document.querySelector("#input");
      const configButton = document.querySelector("#config-toggle");
      const configPanel = document.querySelector("#config-panel");
      let session;
      const add = (text, role) => {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        messages.append(node);
        messages.scrollTop = messages.scrollHeight;
      };
      const render = (data) => {
        messages.replaceChildren();
        for (const message of data.messages ?? []) add(message.text, message.role);
        for (const feedback of data.feedback ?? []) {
          if (feedback.status === "pending") {
            const card = document.createElement("div");
            card.className = "review";
            const heading = document.createElement("strong");
            heading.textContent = "Feedback review pending";
            const reason = document.createElement("p");
            reason.textContent = feedback.reason;
            const notice = document.createElement("small");
            notice.textContent = "Case filing is unavailable in this candidate harness.";
            card.append(heading, reason, notice);
            const dismiss = document.createElement("button");
            dismiss.textContent = "Dismiss with reason";
            dismiss.onclick = async () => {
              const reason = window.prompt("Reason for dismissal?");
              if (!reason) return;
              const response = await fetch(
                `/api/sessions/${encodeURIComponent(session.sessionId)}/feedback/${encodeURIComponent(feedback.messageId)}/disposition`,
                {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ action: "dismiss", reason }),
                },
              );
              const result = await response.json();
              if (!response.ok) return alert(result.error ?? "Dismissal failed");
              render(result.session);
            };
            const file = document.createElement("button");
            file.textContent = "File case (unavailable)";
            file.disabled = true;
            card.append(dismiss, file);
            messages.append(card);
          }
        }
      };
      async function showRuntimeConfig() {
        const response = await fetch(
          `/api/sessions/${encodeURIComponent(session.sessionId)}/config`,
        );
        if (!response.ok) throw new Error("Cannot access the runtime configuration");
        const config = await response.json();
        document.querySelector("#config-summary").textContent =
          `${config.name} · model ${config.model} · config ${config.version} · skills: prompt-only`;
        for (const section of ["identity", "policy", "behavior"]) {
          document.querySelector(`#config-${section}`).textContent =
            config.documents[section] ?? "(not loaded)";
        }
        const list = document.querySelector("#config-skills");
        list.replaceChildren();
        for (const skill of config.skills) {
          const row = document.createElement("div");
          row.className = "skill-row";
          const label = document.createElement("div");
          const name = document.createElement("strong");
          name.textContent = skill.title;
          const description = document.createElement("small");
          description.textContent = ` ${skill.description} · ${skill.mode}`;
          label.append(name, document.createElement("br"), description);
          const use = document.createElement("button");
          use.type = "button";
          use.textContent = "Use";
          use.setAttribute("aria-label", `Use ${skill.title} skill`);
          use.onclick = () => {
            input.value = `/skill ${skill.id} `;
            configPanel.hidden = true;
            configButton.setAttribute("aria-expanded", "false");
            input.focus();
          };
          row.append(label, use);
          list.append(row);
        }
      }
      configButton.onclick = async () => {
        if (!session) return;
        if (!configPanel.hidden) {
          configPanel.hidden = true;
          configButton.setAttribute("aria-expanded", "false");
          return;
        }
        try {
          await showRuntimeConfig();
          configPanel.hidden = false;
          configButton.setAttribute("aria-expanded", "true");
        } catch (error) {
          alert(error.message);
        }
      };
      async function start() {
        const response = await fetch("/api/sessions", { method: "POST" });
        session = await response.json();
        status.textContent = `Session ${session.sessionId} · pending-only case review`;
        render(session);
      }
      document.querySelector("#chat").onsubmit = async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        add(text, "user");
        const response = await fetch(
          `/api/sessions/${encodeURIComponent(session.sessionId)}/messages`,
          {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ messageId: crypto.randomUUID(), text }),
          },
        );
        const result = await response.json();
        if (result.status === "blocked") {
          render(result.session);
          return;
        }
        if (!response.ok) {
          add(result.error ?? "Request failed", "assistant");
          return;
        }
        if (result.text) add(result.text, "assistant");
        render(result.session);
      };
      start().catch((error) => {
        status.textContent = `Unable to start: ${error.message}`;
      });
    </script>
  </body>
</html>
